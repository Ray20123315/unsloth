# Temporary, branch-scoped workflow to apply the repository's pinned formatter.
# Remove after a successful one-time formatting commit.
name: DaFeiYu RVC one-shot format
on:
  push:
    branches:
      - feature/dafeiyu-rvc-unsloth
    paths:
      - '.github/workflows/dafeiyu-rvc-one-shot-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repo-pinned formatter
        run: |
          python -c 'import sys; sys.path.insert(0, "scripts"); import run_ruff_format as r; print("\n".join(r.pinned_requirements(r.CONFIG.read_text(encoding = "utf-8"))))' > "$RUNNER_TEMP/ruff-unsloth.txt"
          test -s "$RUNNER_TEMP/ruff-unsloth.txt"
          python -m pip install -r "$RUNNER_TEMP/ruff-unsloth.txt"
      - name: Format RVC branch Python changes
        run: |
          python scripts/run_ruff_format.py \
            studio/backend/core/inference/audio_cpp_backend.py \
            studio/backend/core/inference/audio_cpp_convert.py \
            studio/backend/core/inference/audio_cpp_models.py \
            studio/backend/core/inference/audio_rvc_models.py \
            studio/backend/main.py \
            studio/backend/models/inference.py \
            studio/backend/routes/__init__.py \
            studio/backend/routes/audio_rvc.py \
            studio/backend/routes/inference.py \
            studio/backend/tests/multi_account/factories_media.py \
            studio/backend/tests/test_audio_cpp_convert_requests.py \
            studio/backend/tests/test_audio_cpp_models.py \
            studio/backend/tests/test_audio_run_route.py \
            studio/backend/tests/test_audio_rvc_models.py \
            studio/backend/tests/test_audio_rvc_routes.py \
            studio/backend/utils/upload_limits.py \
            tests/test_parallel_general_gloo.py
          git diff --check
      - name: Commit formatted source back to this feature branch
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add -- '*.py'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style: apply pinned Ruff formatter to RVC changes"
          git push origin HEAD:refs/heads/feature/dafeiyu-rvc-unsloth
